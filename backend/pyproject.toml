[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scale-mobili-torino"
version = "0.1.0"
description = "API e MCP della prova civica Scale Mobili Torino"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "mangum>=0.19,<1",
  "mcp>=1.20,<2",
  "pydantic-settings>=2.6,<3",
  "pyjwt[crypto]>=2.9,<3",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.9,<1", "moto[dynamodb,s3]>=5,<6", "playwright>=1.50,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/scale_mobili"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
